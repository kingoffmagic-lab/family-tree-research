name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow python-docx
      - run: python scripts/validate_catalogue.py
      - run: python scripts/render_catalogue.py --check
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s tests
        working-directory: vendor/ex-ussr-kinship-research
